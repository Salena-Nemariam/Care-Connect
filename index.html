<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Care Connect - Project 1</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <style>
      body { font-family: 'Inter', sans-serif; }
      .animate-fade-in { animation: fadeIn 0.5s ease-in; }
      @keyframes fadeIn { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }
    </style>
    
    <!-- Import Map: STRICTLY using React 18 via esm.sh to prevent version conflicts -->
    <script type="importmap">
{
  "imports": {
    "react": "https://esm.sh/react@18.2.0",
    "react-dom/client": "https://esm.sh/react-dom@18.2.0/client",
    "@google/genai": "https://esm.sh/@google/genai",
    "react-dom/": "https://aistudiocdn.com/react-dom@^19.2.0/",
    "react/": "https://aistudiocdn.com/react@^19.2.0/"
  }
}
</script>
    <!-- Babel for in-browser compilation -->
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
</head>
<body class="bg-gray-50 text-gray-900 selection:bg-teal-100 selection:text-teal-900">
    <div id="root"></div>

    <script type="text/babel" data-type="module">
        import React, { useState } from 'react';
        import { createRoot } from 'react-dom/client';
        import { GoogleGenAI } from '@google/genai';

        // ==========================================
        // 🔑 API KEY CONFIGURATION
        // ==========================================
        const apiKey = 'AIzaSyD4pLI6nu1mBz4arQVXHmykd5nkfXAspZI';
        
        // Initialize Gemini
        let ai = null;
        if (apiKey && apiKey !== 'PASTE_YOUR_GEMINI_API_KEY_HERE') {
            ai = new GoogleGenAI({ apiKey });
        }

        // ==========================================
        // 🧠 LOGIC & SERVICES
        // ==========================================
        
        const checkApiKey = () => {
            if (!ai) {
                alert("Please check your API Key configuration.");
                return false;
            }
            return true;
        };

        const simplifyMedicalText = async (text) => {
            if (!checkApiKey()) throw new Error("No API Key");
            
            try {
                const response = await ai.models.generateContent({
                    model: 'gemini-2.5-flash',
                    contents: `You are a helpful medical translator. Your goal is to make healthcare accessible.
                    Rewrite the following complex medical text into simple, easy-to-understand language (5th-grade reading level).
                    Explain any difficult terms.
                    
                    Text to simplify: "${text}"
                    
                    IMPORTANT: I am an AI assistant, not a doctor. This information is for educational purposes only.`,
                });
                return response.text || "Could not generate a response.";
            } catch (error) {
                console.error("Error simplifying text:", error);
                throw new Error("Failed to simplify text. Check your API Key.");
            }
        };

        const findHealthcareResources = async (query) => {
            if (!checkApiKey()) throw new Error("No API Key");

            try {
                const response = await ai.models.generateContent({
                    model: 'gemini-2.5-flash',
                    contents: `Help a user find healthcare access resources based on this query: "${query}". 
                    Focus on accessibility, free/low-cost options, or specialized care.`,
                    config: {
                        tools: [{ googleSearch: {} }]
                    }
                });

                const text = response.text || "I couldn't find specific resources.";
                
                // Extract chunks for sources
                const chunks = response.candidates?.[0]?.groundingMetadata?.groundingChunks || [];
                const links = chunks
                    .map(chunk => chunk.web)
                    .filter(web => web && web.uri && web.title)
                    .map(web => ({ title: web.title, url: web.uri }));

                return { text, links };
            } catch (error) {
                console.error("Error finding resources:", error);
                throw new Error("Failed to search resources. Double check your API Key permissions.");
            }
        };

        // ==========================================
        // 🎨 COMPONENTS
        // ==========================================

        const Button = ({ children, variant = 'primary', isLoading, className = '', disabled, ...props }) => {
            const baseStyles = "px-6 py-3 rounded-xl font-medium transition-all duration-200 flex items-center justify-center gap-2 shadow-sm focus:outline-none focus:ring-2 focus:ring-offset-2";
            const variants = {
                primary: "bg-teal-600 text-white hover:bg-teal-700 focus:ring-teal-500 disabled:bg-teal-300",
                secondary: "bg-blue-600 text-white hover:bg-blue-700 focus:ring-blue-500 disabled:bg-blue-300",
            };
            return (
                <button 
                    className={`${baseStyles} ${variants[variant] || variants.primary} ${className} ${disabled || isLoading ? 'cursor-not-allowed opacity-80' : ''}`}
                    disabled={disabled || isLoading}
                    {...props}
                >
                    {isLoading ? (
                        <>
                           <svg className="animate-spin h-5 w-5" viewBox="0 0 24 24"><circle className="opacity-25" cx="12" cy="12" r="10" stroke="currentColor" strokeWidth="4" fill="none"></circle><path className="opacity-75" fill="currentColor" d="M4 12a8 8 0 018-8V0C5.373 0 0 5.373 0 12h4zm2 5.291A7.962 7.962 0 014 12H0c0 3.042 1.135 5.824 3 7.938l3-2.647z"></path></svg>
                           Processing...
                        </>
                    ) : children}
                </button>
            );
        };

        const Header = ({ onTabChange }) => (
            <header className="bg-white border-b border-gray-100 sticky top-0 z-50">
                <div className="max-w-6xl mx-auto px-4 sm:px-6 lg:px-8">
                    <div className="flex justify-between items-center h-16">
                        <div className="flex items-center gap-2 cursor-pointer" onClick={() => onTabChange(null)}>
                            <div className="w-8 h-8 bg-teal-600 rounded-lg flex items-center justify-center text-white font-bold text-xl">C</div>
                            <div className="flex flex-col sm:flex-row sm:items-center">
                                <span className="font-bold text-xl tracking-tight text-gray-900">Care Connect</span>
                                <span className="ml-0 sm:ml-2 mt-1 sm:mt-0 text-[10px] uppercase font-bold tracking-wider text-teal-600 bg-teal-50 px-2 py-0.5 rounded-full border border-teal-100 w-fit">Project 1</span>
                            </div>
                        </div>
                        <nav className="hidden md:flex space-x-1">
                            <button onClick={() => onTabChange(null)} className="px-3 py-2 rounded-md text-sm font-medium text-gray-500 hover:text-gray-900 hover:bg-gray-50">Home</button>
                             <a 
                              href="https://salena-nemariam.github.io/salenanemariam-portfolio/#about"
                              target="_blank"
                              rel="noopener noreferrer"
                              className="px-3 py-2 rounded-md text-sm font-medium text-gray-500 hover:text-gray-900 hover:bg-gray-50"
                            >
                              Back to Portfolio
                            </a>
                        </nav>
                    </div>
                </div>
            </header>
        );

        const Simplifier = () => {
            const [input, setInput] = useState('');
            const [output, setOutput] = useState('');
            const [loading, setLoading] = useState(false);
            const [error, setError] = useState('');

            const handleSimplify = async () => {
                if (!input.trim()) return;
                setLoading(true);
                setError('');
                try {
                    const result = await simplifyMedicalText(input);
                    setOutput(result);
                } catch (e) {
                    setError(e.message);
                } finally {
                    setLoading(false);
                }
            };

            return (
                <div className="max-w-3xl mx-auto animate-fade-in">
                    <div className="bg-white rounded-2xl shadow-xl overflow-hidden">
                        <div className="p-8 bg-indigo-600 text-white">
                            <h2 className="text-3xl font-bold mb-2">Medical Translator</h2>
                            <p className="text-indigo-100 text-lg">Paste confusing medical jargon below.</p>
                        </div>
                        <div className="p-8 space-y-6">
                            <textarea
                                className="w-full h-40 p-4 rounded-xl border border-gray-200 focus:ring-2 focus:ring-indigo-500 transition-all resize-none bg-gray-50"
                                placeholder="e.g., 'Patient presents with acute rhinosinusitis...'"
                                value={input}
                                onChange={(e) => setInput(e.target.value)}
                            />
                            {error && <div className="p-4 bg-red-50 text-red-700 rounded-xl border border-red-100">{error}</div>}
                            <div className="flex justify-end">
                                <Button onClick={handleSimplify} isLoading={loading} disabled={!input.trim()} className="bg-indigo-600 hover:bg-indigo-700">Simplify Text</Button>
                            </div>
                            {output && (
                                <div className="mt-8 animate-fade-in">
                                    <div className="flex items-center justify-between mb-2">
                                        <label className="block text-sm font-medium text-gray-700">Simplified Explanation</label>
                                        <span className="text-xs font-medium px-2 py-1 bg-green-100 text-green-700 rounded-full">5th Grade Level</span>
                                    </div>
                                    <div className="bg-indigo-50 p-6 rounded-xl border border-indigo-100 text-gray-800 leading-relaxed">
                                        {output}
                                    </div>
                                </div>
                            )}
                        </div>
                    </div>
                </div>
            );
        };

        const ResourceFinder = () => {
            const [query, setQuery] = useState('');
            const [result, setResult] = useState(null);
            const [loading, setLoading] = useState(false);

            const handleSearch = async (e) => {
                e.preventDefault();
                if (!query.trim()) return;
                setLoading(true);
                try {
                    const response = await findHealthcareResources(query);
                    setResult(response);
                } catch (e) {
                    console.error(e);
                    alert(e.message);
                } finally {
                    setLoading(false);
                }
            };

            return (
                <div className="max-w-3xl mx-auto animate-fade-in">
                    <div className="bg-white rounded-2xl shadow-xl overflow-hidden">
                        <div className="p-8 bg-rose-600 text-white">
                            <h2 className="text-3xl font-bold mb-2">Care Navigator</h2>
                            <p className="text-rose-100 text-lg">Find free clinics and resources near you.</p>
                        </div>
                        <div className="p-8 space-y-6">
                            <form onSubmit={handleSearch} className="flex gap-2">
                                <input
                                    type="text"
                                    className="flex-1 p-4 rounded-xl border border-gray-200 focus:ring-2 focus:ring-rose-500"
                                    placeholder="e.g., 'Free dental clinics in Chicago'"
                                    value={query}
                                    onChange={(e) => setQuery(e.target.value)}
                                />
                                <Button type="submit" isLoading={loading} className="bg-rose-600 hover:bg-rose-700">Search</Button>
                            </form>
                            {result && (
                                <div className="space-y-6 animate-fade-in">
                                    <div className="bg-white p-6 rounded-xl border border-gray-200 shadow-sm prose text-gray-700">
                                        {result.text}
                                    </div>
                                    {result.links.length > 0 && (
                                        <div className="grid gap-3">
                                            {result.links.map((link, idx) => (
                                                <a key={idx} href={link.url} target="_blank" rel="noopener noreferrer" className="flex items-center p-4 bg-gray-50 rounded-lg hover:bg-gray-100 border border-gray-200 group">
                                                    <span className="bg-white p-2 rounded-md shadow-sm mr-3 text-rose-600">🔗</span>
                                                    <div className="font-medium text-blue-600 hover:underline">{link.title}</div>
                                                </a>
                                            ))}
                                        </div>
                                    )}
                                </div>
                            )}
                        </div>
                    </div>
                </div>
            );
        };

        const LandingPage = ({ onSelect }) => (
            <div className="max-w-4xl mx-auto mt-8">
                <div className="text-center mb-16">
                    <div className="inline-block mb-4 px-4 py-1.5 rounded-full bg-teal-50 border border-teal-100 text-teal-700 font-semibold text-sm tracking-wide uppercase shadow-sm">
                        Project 1: AI Exploration
                    </div>
                    <h1 className="text-4xl md:text-6xl font-bold text-gray-900 mb-6 tracking-tight">
                      Care Connect <br/>
                      <span className="text-transparent bg-clip-text bg-gradient-to-r from-teal-500 to-blue-600">Healthcare Access with AI</span>
                    </h1>
                    <p className="text-xl text-gray-600 max-w-2xl mx-auto leading-relaxed">
                      Explore how Gemini AI can bridge gaps in healthcare literacy and navigation.
                    </p>
                </div>
                <div className="grid md:grid-cols-2 gap-8">
                    <button onClick={() => onSelect('SIMPLIFIER')} className="bg-white p-8 rounded-3xl shadow-sm border border-gray-100 hover:shadow-xl transition-all group text-left hover:-translate-y-1">
                        <div className="bg-indigo-600 w-14 h-14 rounded-2xl flex items-center justify-center text-3xl mb-6 text-white shadow-lg">📝</div>
                        <h3 className="text-2xl font-bold text-gray-900 mb-2 group-hover:text-indigo-600">Medical Translator</h3>
                        <p className="text-gray-500">Understand complex medical documents in plain language.</p>
                        <div className="mt-6 text-indigo-600 font-bold opacity-0 group-hover:opacity-100 transition-opacity">Try Demo →</div>
                    </button>
                    <button onClick={() => onSelect('RESOURCE_FINDER')} className="bg-white p-8 rounded-3xl shadow-sm border border-gray-100 hover:shadow-xl transition-all group text-left hover:-translate-y-1">
                        <div className="bg-rose-600 w-14 h-14 rounded-2xl flex items-center justify-center text-3xl mb-6 text-white shadow-lg">📍</div>
                        <h3 className="text-2xl font-bold text-gray-900 mb-2 group-hover:text-rose-600">Care Navigator</h3>
                        <p className="text-gray-500">Locate nearby clinics and community resources.</p>
                        <div className="mt-6 text-rose-600 font-bold opacity-0 group-hover:opacity-100 transition-opacity">Try Demo →</div>
                    </button>
                </div>
            </div>
        );

        const App = () => {
            const [activeTab, setActiveTab] = useState(null);
            return (
                <div className="min-h-screen pb-20">
                    <Header onTabChange={setActiveTab} />
                    <main className="p-4 md:p-8">
                        {activeTab === 'SIMPLIFIER' && <Simplifier />}
                        {activeTab === 'RESOURCE_FINDER' && <ResourceFinder />}
                        {!activeTab && <LandingPage onSelect={setActiveTab} />}
                    </main>
                    <footer className="fixed bottom-0 w-full bg-white border-t border-gray-200 p-4 text-center text-gray-400 text-sm">
                        © 2024 Care Connect (Project 1). Built with Google Gemini.
                    </footer>
                </div>
            );
        };

        const root = createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>
</html>
